<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LeakWatch{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: Canvas; color: CanvasText; }
    header { padding: 12px 20px; border-bottom: 1px solid #8884; display: flex; align-items: baseline; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    header .tag { font-size: 12px; opacity: .7; }
    main { padding: 20px; max-width: 1100px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #8883; }
    th { font-weight: 600; opacity: .8; }
    tr:hover td { background: #8881; }
    code { font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid #8886; }
    form.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: end; }
    label { font-size: 12px; opacity: .8; display: block; }
    select, input, button { padding: 6px 8px; font-size: 14px; }
    a { color: inherit; }
    .banner { background: #f0ad4e22; border: 1px solid #f0ad4e88; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    pre { white-space: pre-wrap; background: #8881; padding: 14px; border-radius: 6px; font-size: 13px; overflow-x: auto; }
    .muted { opacity: .65; }
  </style>
</head>
<body>
  <header>
    <h1>🔎 LeakWatch</h1>
    <span class="tag">responsible-disclosure monitor · redacted, local only</span>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
